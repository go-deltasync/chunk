name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
        if: matrix.os == 'ubuntu-latest'
      - run: go test ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go test -race ./...

  coverage:
    name: 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      # Every line of a chunker is on the path some stream takes, so there is no
      # line here that a test cannot reach. The gate says so rather than trusting
      # it.
      - run: |
          go test -coverprofile=cover.out ./...
          go tool cover -func=cover.out
          below=$(go tool cover -func=cover.out | awk '$NF != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100% on:"
            echo "$below"
            exit 1
          fi

  arches:
    name: build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      # A chunk is a name for its contents, so where the cuts fall must not
      # depend on the machine. The tests that pin that run on every architecture
      # the fleet supports, under emulation where it is not native.
      - run: GOARCH=${{ matrix.goarch }} go build ./...
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: Install qemu user-mode emulators
        if: matrix.goarch != 'amd64' && matrix.goarch != 'arm64'
        run: |
          apt=(-y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          if timeout 240 sudo apt-get install "${apt[@]}" qemu-user qemu-user-binfmt; then
            exit 0
          fi
          for attempt in 1 2; do
            echo "::warning::the runner's package lists were not enough; refreshing them (attempt $attempt)"
            timeout 240 sudo apt-get update "${apt[@]}" || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
            sudo dpkg --configure -a || true
            if timeout 240 sudo apt-get install "${apt[@]}" qemu-user qemu-user-binfmt; then
              exit 0
            fi
          done
          echo "::error::qemu-user qemu-user-binfmt could not be installed"
          exit 1
      - name: Test
        run: |
          # ⛔ Resolve the emulator, accept EITHER binary name, and FAIL when neither
          # is there -- a lane that reports success for an architecture it never ran is
          # the one outcome this matrix exists to rule out. qemu-user ships the dynamic
          # qemu-<arch>; qemu-user-static, now a virtual package, shipped the static one.
          qemu_for() {
            for cand in "qemu-$1-static" "qemu-$1"; do
              command -v "$cand" >/dev/null 2>&1 && { printf '%s\n' "$cand"; return 0; }
            done
            echo "::error::no qemu user emulator for $1 (looked for qemu-$1-static and qemu-$1)" >&2
            return 1
          }
          case "${{ matrix.goarch }}" in
            amd64|arm64) go test ./... ;;
            riscv64) e="$(qemu_for riscv64)" || exit 1; echo "running riscv64 under $e"; GOARCH=riscv64 go test -exec="$e" ./... ;;
            loong64) e="$(qemu_for loongarch64)" || exit 1; echo "running loong64 under $e"; GOARCH=loong64 go test -exec="$e" ./... ;;
            ppc64le) e="$(qemu_for ppc64le)" || exit 1; echo "running ppc64le under $e"; GOARCH=ppc64le go test -exec="$e" ./... ;;
            s390x) e="$(qemu_for s390x)" || exit 1; echo "running s390x under $e"; GOARCH=s390x   go test -exec="$e" ./... ;;
          esac
